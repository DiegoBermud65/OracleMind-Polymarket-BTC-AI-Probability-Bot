<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#070b12"/>
  <rect x="0" y="0" width="1200" height="60" fill="#111827"/>
  <text x="32" y="38" fill="#818cf8" font-family="Segoe UI" font-size="20" font-weight="700">OracleMind  Win Rate &amp; Setup Analysis</text>

  <rect x="32" y="80" width="360" height="280" rx="12" fill="#111827" stroke="#1e293b"/>
  <text x="48" y="110" fill="#94a3b8" font-family="Segoe UI" font-size="14">Win Rate by Setup Type</text>
  <text x="60" y="160" fill="#e2e8f0" font-family="Segoe UI" font-size="12">Early Window Edge</text>
  <rect x="220" y="145" width="150" height="18" rx="4" fill="#1e293b"/>
  <rect x="220" y="145" width="107" height="18" rx="4" fill="#34d399"/>
