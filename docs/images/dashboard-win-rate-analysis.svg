  <text x="60" y="200" fill="#e2e8f0" font-family="Segoe UI" font-size="12">Mid-Window Mispricing</text>
  <rect x="220" y="185" width="150" height="18" rx="4" fill="#1e293b"/>
  <rect x="220" y="185" width="99" height="18" rx="4" fill="#818cf8"/>
  <text x="380" y="200" fill="#818cf8" font-family="Segoe UI" font-size="12">66%</text>

  <text x="60" y="240" fill="#e2e8f0" font-family="Segoe UI" font-size="12">Full TF Alignment</text>
  <rect x="220" y="225" width="150" height="18" rx="4" fill="#1e293b"/>
  <rect x="220" y="225" width="122" height="18" rx="4" fill="#34d399"/>
